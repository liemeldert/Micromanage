# Used by the nanomdm-direct service in docker-compose.prod.yml, which only starts under the
# "direct-nanomdm" compose profile. If your proxy runs on the same docker network,
# it can reach http://nanomdm:9000 directly and needs neither this file nor a published port.
#
# This passes /v1/* and /version through as well as exposing /mdm to allow compatability with existing setups.
# Mounts /etc/nginx/conf.d/default.conf
#   docker run --rm -v "$PWD/deploy/nanomdm-direct.conf":/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine nginx -t

server {
    listen 8080;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $nanomdm_upstream http://nanomdm:9000;
        proxy_pass $nanomdm_upstream;

        client_max_body_size 0;
        client_body_buffer_size 256k;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
