version: 2
flows:
- id: enrollment
  name: Device enrollment
  description: Runs when a device enrolls. Waits for the device to report itself,
    then releases it from Setup Assistant. Add your profiles, apps and account setup
    between the two.
  enabled: true
  permanent: true
  nodes:
  - id: start-dep
    type: start
    params:
      kind: enroll_dep
      match: {}
    ui:
      x: -260
      y: -80
    next: await-info
  - id: start-ota
    type: start
    params:
      kind: enroll_profile
      match: {}
    ui:
      x: -260
      y: 80
    next: await-info
  - id: await-info
    type: wait_for
    params:
      signal: device_info
      timeout_minutes: 30
    ui:
      x: 0
      y: 0
    next: release
    on_timeout: gate-stuck
  - id: gate-stuck
    type: manual_gate
    params:
      summary: Device has not reported in since it enrolled
      severity: yellow
      options:
      - label: Release it from Setup Assistant
        edge: on_release
      - label: Stop this run
        edge: on_cancel
    ui:
      x: 0
      y: 240
    on_release: release
    on_cancel: done
  - id: release
    type: release_device
    params: {}
    ui:
      x: 280
      y: 0
    next: done
  - id: done
    type: end
    params: {}
    ui:
      x: 520
      y: 0
