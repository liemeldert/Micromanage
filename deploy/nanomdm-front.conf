# Devices only need to access /mdm, so this proxies that one path only to NanoMDM.
# The other paths like /v1 are not proxied, as they are not needed to be accessed by devices.
#
# Mounts at /etc/nginx/conf.d/default.conf

server {
    listen 8080;
    server_name _;

    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /mdm {
        set $nanomdm_upstream http://nanomdm:9000;
        proxy_pass $nanomdm_upstream;
        client_max_body_size 0;
        client_body_buffer_size 256k;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Long timeouts, as MDM commands can be slow with large device counts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
