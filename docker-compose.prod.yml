services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mdm_iac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  stepca-volumes-init:
    image: smallstep/step-ca:0.30.2
    user: "0:0"
    entrypoint: [ "sh", "-ec" ]
    command:
      - |
        chown 1000:1000 /stepca-certs /stepca-tls /stepca-webhook
        chmod 0755 /stepca-certs
        chmod 0700 /stepca-tls /stepca-webhook
    volumes:
      - stepca_certs:/stepca-certs
      - stepca_tls:/stepca-tls
      - stepca_webhook:/stepca-webhook
    restart: "no"

  # On first boot, initialises an RSA CA chain (SCEP needs an RSA intermediate to decrypt the enrollment pkcsPKIEnvelope
  # as step ca init only makes ECDSA) and registers the SCEP provisioner devices enroll against. Every boot re-runs the
  # admin API setup and the certificate mints.
  step-ca:
    image: smallstep/step-ca:0.30.2
    init: true
    environment:
      STEPCA_NAME: ${STEPCA_NAME:-MicromanageCA}
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:?set STEPCA_PASSWORD}
      MDM_HOSTNAME: ${MDM_HOSTNAME:?set MDM_HOSTNAME}
      SCEP_NAME: ${SCEP_NAME:-mdm_device_scep}
    volumes:
      - step_ca_data:/home/step
      - stepca_certs:/stepca-certs
      - stepca_tls:/stepca-tls
      - stepca_webhook:/stepca-webhook
    depends_on:
      stepca-volumes-init:
        condition: service_completed_successfully
    entrypoint: [ "sh", "-ec" ]
    command:
      - |
        export STEPPATH=/home/step
        PW="$$STEPPATH/password"; CFG="$$STEPPATH/config/ca.json"; TPL="$$STEPPATH/templates"
        ROOT="$$STEPPATH/certs/root_ca.crt"; ROOT_KEY="$$STEPPATH/secrets/root_ca_key"
        INT="$$STEPPATH/certs/intermediate_ca.crt"; INT_KEY="$$STEPPATH/secrets/intermediate_ca_key"
        CERTS=/stepca-certs; TLS=/stepca-tls; WH=/stepca-webhook
        log() { echo "step-ca: $$*"; }
        rand() { head -c 32 /dev/urandom | base64 | tr -d '\n/+='; }
        if [ ! -f "$$CFG" ]; then
          log "first-run init with an RSA chain for SCEP"
          printf '%s' "$$STEPCA_PASSWORD" > "$$PW"
          step ca init --name "$$STEPCA_NAME" --dns "step-ca,localhost,$$MDM_HOSTNAME" \
            --provisioner admin --password-file "$$PW" --provisioner-password-file "$$PW" --address :9000
          step certificate create "$$STEPCA_NAME Root CA" "$$ROOT" "$$ROOT_KEY" \
            --profile root-ca --kty RSA --size 2048 --password-file "$$PW" --force
          step certificate create "$$STEPCA_NAME Intermediate CA" "$$INT" "$$INT_KEY" \
            --profile intermediate-ca --ca "$$ROOT" --ca-key "$$ROOT_KEY" \
            --kty RSA --size 2048 --password-file "$$PW" --ca-password-file "$$PW" --force
          step ca provisioner add "$$SCEP_NAME" --type SCEP --challenge "$$(rand)" \
            --encryption-algorithm-identifier 2 --x509-default-dur 8760h --x509-max-dur 8760h --ca-config "$$CFG"
          log "init complete (RSA chain and SCEP provisioner $$SCEP_NAME)"
        fi

        set +e
        # The SCEP challenges in ca.json are replaced with a random value, since ca.json stops being read once the
        # admin API is up
        if [ "$$(jq -r '.authority.enableAdmin // false' "$$CFG")" != true ]; then
          cp "$$CFG" "$$CFG.pre-admin.bak" && jq --arg c "$$(rand)" '.authority.enableAdmin = true
            | (.authority.provisioners[]? | select(.type == "SCEP") | .challenge) = $$c' "$$CFG" > "$$CFG.tmp" \
            && mv "$$CFG.tmp" "$$CFG" && log "admin API enabled (backup: $$CFG.pre-admin.bak)" \
            || log "ERROR: could not enable the admin API"
        fi

        mkdir -p "$$TPL"
        cat > "$$TPL/scep-front.tpl" <<'EOF' || log "ERROR: could not write the scep-front template"
        {"subject": {{ toJson .Subject }}, "sans": {{ toJson .SANs }},
         "keyUsage": ["digitalSignature", "keyEncipherment"], "extKeyUsage": ["serverAuth"]}
        EOF
        # Device identities keep the CSR subject, carry no SANs and are client certificates only.
        cat > "$$TPL/scep-device.tpl" <<'EOF' || log "ERROR: could not write the device certificate template"
        {"subject": {{ toJson .Subject }},
         "keyUsage": ["digitalSignature", "keyEncipherment"], "extKeyUsage": ["clientAuth"]}
        EOF

        # 397 days, re-minted with 30 days left, when MDM_HOSTNAME is not among its SANs or when it does not chain to
        # the current root.
        tls_current() {
          [ -s "$$TLS/scep-front.key" ] && [ -s "$$TLS/scep-front.crt" ] \
            && ! step certificate needs-renewal "$$TLS/scep-front.crt" --expires-in 720h >/dev/null 2>&1 \
            && step certificate verify "$$TLS/scep-front.crt" --roots "$$ROOT" >/dev/null 2>&1 \
            && step certificate inspect "$$TLS/scep-front.crt" --format json 2>/dev/null \
              | jq -e --arg h "$$MDM_HOSTNAME" '.extensions.subject_alt_name.dns_names | index($$h)' >/dev/null
        }
        mint_tls() {
          step certificate create scep-front "$$TLS/scep-front.crt.new" "$$TLS/scep-front.key.new" \
            --template "$$TPL/scep-front.tpl" --san scep-front --san "$$MDM_HOSTNAME" --san localhost \
            --kty RSA --size 2048 --not-after 9528h --ca "$$INT" --ca-key "$$INT_KEY" --ca-password-file "$$PW" \
            --no-password --insecure --bundle --force >/dev/null \
            && mv "$$TLS/scep-front.key.new" "$$TLS/scep-front.key" \
            && mv "$$TLS/scep-front.crt.new" "$$TLS/scep-front.crt" \
            && log "minted the scep-front certificate (scep-front reloads it within 6 hours, or restart it)" \
            || log "ERROR: could not mint the scep-front certificate"
        }
        tls_current || mint_tls

        cp "$$ROOT" "$$CERTS/root_ca.crt.new" && cp "$$INT" "$$CERTS/intermediate_ca.crt.new" \
          && chmod 0644 "$$CERTS/root_ca.crt.new" "$$CERTS/intermediate_ca.crt.new" \
          && mv "$$CERTS/root_ca.crt.new" "$$CERTS/root_ca.crt" \
          && mv "$$CERTS/intermediate_ca.crt.new" "$$CERTS/intermediate_ca.crt" \
          || log "ERROR: could not copy the CA certificates to $$CERTS"

        # Admin API work runs once the CA answers. Double fork, so tini (init: true) reaps it. Changes are checked
        # against the running CA's provisioner list, since ca.json stops being authoritative once the admin API is on.
        ( (
          umask 077
          # One-time admin work in its own subshell, so an early exit still leaves the daily certificate check.
          (
            ADM="--ca-url https://localhost:9000 --root $$ROOT --admin-provisioner admin --admin-subject step"
            # A nonexistent --ca-config turns an unreachable admin API into an error instead of an edit to ca.json.
            ADM="$$ADM --admin-password-file $$PW --ca-config /nonexistent/ca.json"
            provs() { curl -sf --cacert "$$ROOT" "https://localhost:9000/provisioners?limit=100"; }
            scep() { provs | jq -c --arg n "$$SCEP_NAME" '.provisioners[] | select(.name == $$n)'; }
            i=0
            until step ca health --ca-url https://localhost:9000 --root "$$ROOT" >/dev/null 2>&1; do
              i=$$((i + 1))
              [ "$$i" -ge 90 ] && { log "ERROR: CA not healthy after 180s, admin setup skipped"; exit 0; }
              sleep 2
            done

            # The running CA redacts the challenge in its provisioner list, so the exit status is the only check.
            step ca provisioner update "$$SCEP_NAME" --challenge "$$(rand)" $$ADM >/dev/null \
              && log "static challenge rotated" || log "ERROR: could not rotate the static challenge"

            for p in $$(provs | jq -r '.provisioners[] | select(.type == "ACME") | .name'); do
              step ca provisioner remove "$$p" $$ADM >/dev/null
              provs | jq -e --arg p "$$p" 'any(.provisioners[]; .name == $$p) | not' >/dev/null \
                && log "removed ACME provisioner $$p" || log "ERROR: ACME provisioner $$p is still present"
            done

            tpl() { scep | jq -r '.options.x509.template // empty'; }
            if [ "$$(tpl)" != "$$(cat "$$TPL/scep-device.tpl")" ]; then
              step ca provisioner update "$$SCEP_NAME" --x509-template "$$TPL/scep-device.tpl" $$ADM >/dev/null
              [ "$$(tpl)" = "$$(cat "$$TPL/scep-device.tpl")" ] && log "device certificate template installed" \
                || log "ERROR: the device certificate template did not reach the running CA"
            fi

            # Re-added when the secret file is missing or the stored id is not the CA's, as after a restored volume.
            cur=$$(scep | jq -r '(.options.webhooks // [])[] | select(.name == "controller") | .id')
            if [ -n "$$cur" ] && { [ ! -s "$$WH/scep_webhook_secret" ] \
                || [ "$$(cat "$$WH/scep_webhook_id" 2>/dev/null)" != "$$cur" ]; }; then
              step ca provisioner webhook remove "$$SCEP_NAME" controller $$ADM >/dev/null && cur= \
                || log "ERROR: could not remove the webhook whose secret is missing"
            fi
            if [ -z "$$cur" ]; then
              out=$$(step ca provisioner webhook add "$$SCEP_NAME" controller --kind SCEPCHALLENGE \
                --url https://scep-front:8081/webhook/scep-challenge $$ADM)
              id=$$(printf '%s\n' "$$out" | sed -n 's/^Webhook ID: //p')
              sec=$$(printf '%s\n' "$$out" | sed -n 's/^Secret: //p')
              if [ -n "$$id" ] && [ -n "$$sec" ]; then
                printf '%s' "$$id" > "$$WH/scep_webhook_id.tmp" \
                  && printf '%s' "$$sec" > "$$WH/scep_webhook_secret.tmp" \
                  && mv "$$WH/scep_webhook_id.tmp" "$$WH/scep_webhook_id" \
                  && mv "$$WH/scep_webhook_secret.tmp" "$$WH/scep_webhook_secret" && log "webhook attached" \
                  || log "ERROR: could not write the webhook secret"
              else
                log "ERROR: webhook add printed no id or secret"
              fi
            fi
            scep | jq -e --arg id "$$(cat "$$WH/scep_webhook_id" 2>/dev/null)" \
              '[(.options.webhooks // [])[] | select(.id == $$id and .kind == "SCEPCHALLENGE")] | length == 1' \
              >/dev/null && log "webhook verified on $$SCEP_NAME" \
              || log "ERROR: no SCEPCHALLENGE webhook matching the stored id"
          )
          while sleep 1d; do tls_current || mint_tls; done
        ) & )
        exec step-ca "$$CFG" --password-file "$$PW"
    healthcheck:
      test: [ "CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nanomdm-schema:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "sh", "-ec" ]
    command:
      - |
        psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='nanomdm'" | grep -q 1 \
          || psql -h postgres -U postgres -c "CREATE DATABASE nanomdm"
        if psql -h postgres -U postgres -d nanomdm -tAc "select to_regclass('public.push_certs')" | grep -q push_certs; then
          echo "nanomdm-schema: tables already present"
        else
          # Runs once, since push_certs exists after the first apply. Bumping the nanomdm image tag does not apply
          # schema changes; check storage/pgsql/ in the new tag for numbered schema-change files first, per
          # https://github.com/micromdm/nanomdm/blob/v0.9.0/docs/operations-guide.md
          echo "nanomdm-schema: fetching NanoMDM 0.9.0 pgsql schema..."
          wget -qO /tmp/schema.sql https://raw.githubusercontent.com/micromdm/nanomdm/v0.9.0/storage/pgsql/schema.sql
          # Pinned sha256 of that tag's storage/pgsql/schema.sql. The file is downloaded at deploy time and applied as
          # the postgres superuser, so a mismatch aborts.
          echo "33480889eb1154d1213ebba7d99b39fe1f02533266a23733a9b0b2500aceed6b  /tmp/schema.sql" | sha256sum -c - \
            || { echo "nanomdm-schema: schema.sql sha256 mismatch, refusing to apply it" >&2; exit 1; }
          echo "nanomdm-schema: sha256 verified, applying..."
          # One transaction, so a mid-file failure cannot leave push_certs behind and make a partial apply look complete
          # on the next boot. CREATE DATABASE ran in its own psql call above, outside this transaction.
          psql -h postgres -U postgres -d nanomdm -v ON_ERROR_STOP=1 --single-transaction -f /tmp/schema.sql
          echo "nanomdm-schema: done"
        fi
    restart: "no"

  nanomdm:
    image: ghcr.io/micromdm/nanomdm:0.9.0
    environment:
      NANOMDM_API_KEY: ${NANOMDM_API_KEY:?set NANOMDM_API_KEY}
    volumes:
      - stepca_certs:/stepca-certs:ro
      - nanomdm_data:/var/lib/nanomdm
    ports:
      # Loopback only. NanoMDM 0.9.0 serves /mdm, the basic-auth /v1/* management API and /version on one listener (see
      # https://github.com/micromdm/nanomdm/blob/v0.9.0/cmd/nanomdm/main.go), so publishing it on every interface would
      # expose /v1 enqueue, including EraseDevice for the whole fleet, behind one shared secret. The public port is
      # MDM_PORT on nanomdm-front; this mapping is for setup.sh push-cert and local curl against /v1.
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      step-ca:
        condition: service_healthy
      nanomdm-schema:
        condition: service_completed_successfully
    # delete=1 enables NanoMDM's command deleter; see "NanoMDM storage cleanup requirement" in DEPLOY.md. Without it the
    # nanomdm database keeps every raw command plist, including firmware and recovery lock passwords, FileVault recovery
    # keys and managed-admin credentials. Rows that already exist are not purged.
    command: >
      -storage pgsql
      -storage-dsn "postgres://postgres:${DB_PASSWORD}@postgres:5432/nanomdm?sslmode=disable"
      -storage-options delete=1
      -ca /stepca-certs/root_ca.crt
      -intermediate /stepca-certs/intermediate_ca.crt
      -api "${NANOMDM_API_KEY}"
      -webhook-url "http://controller:8000/webhook/mdm"
      -webhook-hmac-key "${WEBHOOK_HMAC_KEY:-${WEBHOOK_SECRET}}"
      -dm "http://controller:8000/ddm/"
      -dm-send-hmac-key "${DDM_HMAC_SECRET:-${WEBHOOK_SECRET}}"
      -debug="${NANOMDM_DEBUG:-false}"
    restart: unless-stopped

  # Public entry point for devices. MDM_PORT maps here, not to the nanomdm listener above. Only /mdm is proxied;
  # everything else, /v1/ and /version included, gets 404, since a 403 would confirm the path exists. Plain HTTP, so put
  # your own TLS-terminating proxy in front of it.
  nanomdm-front:
    image: nginx:1.27-alpine
    volumes:
      # This needs the repo on disk. Portainer's "from this Git repo" option gives you that; pasting this file into the
      # web editor does not.
      - ./deploy/nanomdm-front.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MDM_PORT:-443}:8080"
    depends_on:
      # Ordering only. The config re-resolves the upstream name per request through Docker's DNS, so this front survives
      # nanomdm being recreated underneath it rather than holding a dead address.
      nanomdm:
        condition: service_started
    restart: unless-stopped

  # TLS front for step-ca, published on STEPCA_PORT. It serves only the SCEP provisioner's path to devices and, on an
  # unpublished port, step-ca's challenge webhook to the controller. It reloads nginx every 6 hours to pick up a
  # certificate step-ca has re-minted.
  scep-front:
    image: nginx:1.27-alpine
    init: true
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        (while sleep 6h; do nginx -s reload || echo "scep-front: ERROR: nginx reload failed"; done) &
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    environment:
      SCEP_NAME: ${SCEP_NAME:-mdm_device_scep}
      # Compose turns $$ into $, so nginx's template step substitutes SCEP_NAME and leaves nginx's own variables.
      NGINX_ENVSUBST_FILTER: "^SCEP_NAME$$"
    volumes:
      # Needs the repo on disk, as nanomdm-front does.
      - ./deploy/scep-front.conf.template:/etc/nginx/templates/default.conf.template:ro
      - stepca_certs:/stepca-certs:ro
      - stepca_tls:/stepca-tls:ro
    ports:
      - "${STEPCA_PORT:-9443}:9443" # SCEP endpoint devices reach for their identity certificate
    depends_on:
      step-ca:
        condition: service_healthy
    # A GetCACaps request through the whole path, so a missing template or an unreachable step-ca shows as unhealthy.
    healthcheck:
      test: [ "CMD", "curl", "-fsk", "-o", "/dev/null",
              "https://localhost:9443/scep/${SCEP_NAME:-mdm_device_scep}?operation=GetCACaps" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Off by default. Enable with --profile direct-nanomdm (or COMPOSE_PROFILES=direct-nanomdm) when your own proxy needs
  # NanoMDM's whole listener on a host port; that proxy must then refuse /v1/ and /version itself. A proxy on this
  # compose network can reach http://nanomdm:9000 directly. This service publishes MDM_DIRECT_PORT, not MDM_PORT, so it
  # cannot collide with nanomdm-front; to expose only this one, point MDM_PORT at an unused port.
  nanomdm-direct:
    profiles: [ "direct-nanomdm" ]
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nanomdm-direct.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MDM_DIRECT_PORT:-9001}:8080"
    depends_on:
      nanomdm:
        condition: service_started
    restart: unless-stopped

  # Runs once to upload the APNs push certificate to NanoMDM from base64 env vars.
  apns-init:
    image: alpine:3.20
    depends_on:
      nanomdm:
        condition: service_started
    environment:
      NANOMDM_API_KEY: ${NANOMDM_API_KEY:?set NANOMDM_API_KEY}
      PUSH_CERT_PEM_B64: ${PUSH_CERT_PEM_B64:-}
      PUSH_KEY_PEM_B64: ${PUSH_KEY_PEM_B64:-}
    command:
      - sh
      - -ec
      - |
        apk add --no-cache curl >/dev/null
        if [ -z "$$PUSH_CERT_PEM_B64" ]; then
          echo "apns-init: PUSH_CERT_PEM_B64 not set; skipping push-cert upload"; exit 0
        fi
        echo "$$PUSH_CERT_PEM_B64" | base64 -d > /tmp/push.pem
        echo "$$PUSH_KEY_PEM_B64"  | base64 -d > /tmp/push.key
        echo "apns-init: waiting for nanomdm..."
        i=0
        until curl -sf -u "nanomdm:$$NANOMDM_API_KEY" http://nanomdm:9000/version >/dev/null 2>&1; do
          i=$$((i+1)); [ $$i -gt 30 ] && { echo "apns-init: nanomdm unreachable"; exit 1; }; sleep 2
        done
        if cat /tmp/push.pem /tmp/push.key | curl -sf -u "nanomdm:$$NANOMDM_API_KEY" \
             -X PUT -H "Content-Type: text/plain" --data-binary @- \
             http://nanomdm:9000/v1/pushcert >/dev/null; then
          echo "apns-init: APNs push certificate uploaded"
        else
          echo "apns-init: push-cert upload failed"; exit 1
        fi
    restart: "no"

  # The controller runs as uid 1000 (non-root). This runs once to fix ownership.
  yaml-init:
    image: ${CONTROLLER_IMAGE:-ghcr.io/liemeldert/micromanage_2-controller:stable}
    user: "0:0"
    command: [ "sh", "-c", "mkdir -p /app/yaml-configs/tenants && chown -R 1000:1000 /app/yaml-configs" ]
    volumes:
      - yaml_configs:/app/yaml-configs
    restart: "no"

  controller:
    image: ${CONTROLLER_IMAGE:-ghcr.io/liemeldert/micromanage_2-controller:stable}
    # supervisord stops its programs one at a time (see the note at the top of supervisord.conf), so this must exceed
    # the sum of their stopwaitsecs (30 + 30 + 30 = 90s).
    stop_grace_period: 100s
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/mdm_iac
      NANOMDM_URL: http://nanomdm:9000
      NANOMDM_API_KEY: ${NANOMDM_API_KEY:?set NANOMDM_API_KEY}
      YAML_CONFIG_PATH: /app/yaml-configs
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-micromanage-controller}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-micromanage-api}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      # Key for the HMAC on webhook request bodies (-webhook-hmac-key above). Unset means both sides use WEBHOOK_SECRET.
      WEBHOOK_HMAC_KEY: ${WEBHOOK_HMAC_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${MDM_HOSTNAME}}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      # Addresses uvicorn takes X-Forwarded-For from; set it to the TLS proxy's address.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Enrollment profile generation
      MDM_HOSTNAME: ${MDM_HOSTNAME}
      MDM_TOPIC: ${MDM_TOPIC:-}
      MDM_SERVER_URL: ${MDM_SERVER_URL:-}
      SCEP_URL: ${SCEP_URL:-}
      SCEP_NAME: ${SCEP_NAME:-mdm_device_scep}
      # Written by step-ca when it attaches the challenge webhook.
      SCEP_WEBHOOK_SECRET_FILE: ${SCEP_WEBHOOK_SECRET_FILE:-/stepca-webhook/scep_webhook_secret}
      SCEP_WEBHOOK_ID_FILE: ${SCEP_WEBHOOK_ID_FILE:-/stepca-webhook/scep_webhook_id}
      STEPCA_URL: ${STEPCA_URL:-https://step-ca:9000}
      STEPCA_ROOT_FILE: ${STEPCA_ROOT_FILE:-/stepca-certs/root_ca.crt}
      IDENTITY_RENEW_DAYS: ${IDENTITY_RENEW_DAYS:-30}
      IDENTITY_RENEW_INTERVAL_HOURS: ${IDENTITY_RENEW_INTERVAL_HOURS:-24}
      # Only let pre-provisioned (ADE/placeholder) serials become devices.
      MDM_ENROLL_REQUIRE_KNOWN_SERIAL: ${MDM_ENROLL_REQUIRE_KNOWN_SERIAL:-false}
      # First-run admin (set on first deploy so you can log in, then remove)
      CONTROLLER_BOOTSTRAP_ADMIN_EMAIL: ${CONTROLLER_BOOTSTRAP_ADMIN_EMAIL:-}
      CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD:-}
      CONTROLLER_BOOTSTRAP_TENANT: ${CONTROLLER_BOOTSTRAP_TENANT:-default}
      # S3 / object store (for app packages). use_ssl/path_style aren't env vars;
      # set those per-tenant in config.yaml's s3 block if you need them.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      # Ceiling on what one tenant may keep in its object store prefix, in bytes, for tenants that have no quota of
      # their own (tenant_cli tenant set-quota). Empty or 0 means no ceiling. Uploads over it are refused.
      MDM_DEFAULT_STORAGE_QUOTA_BYTES: ${MDM_DEFAULT_STORAGE_QUOTA_BYTES:-}
      # DEP/ADE (Apple Business/School Manager) + declarative device management
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      DEP_SYNC_INTERVAL_MINUTES: ${DEP_SYNC_INTERVAL_MINUTES:-60}
      DEP_BASE_URL: ${DEP_BASE_URL:-}
      # X-Server-Protocol-Version DEP requests send; nanodep's default. Override only if Apple moves the number.
      DEP_SERVER_PROTOCOL_VERSION: ${DEP_SERVER_PROTOCOL_VERSION:-7}
      DEP_ADE_REQUIRE_APPLE_SIGNATURE: ${DEP_ADE_REQUIRE_APPLE_SIGNATURE:-true}
      DEP_APPLE_ANCHOR_CERTS: ${DEP_APPLE_ANCHOR_CERTS:-}
      DEP_APPLE_DEVICE_CA_NAMES: ${DEP_APPLE_DEVICE_CA_NAMES:-}
      DDM_HMAC_SECRET: ${DDM_HMAC_SECRET:-}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      MDM_MAX_CONCURRENT_TASKS: ${MDM_MAX_CONCURRENT_TASKS:-25}
      # A failed app/profile deployment retries starting MDM_COMMAND_RETRY_MINUTES after the failure and backs off
      # further each time, capped at MDM_COMMAND_RETRY_MAX_MINUTES.
      MDM_COMMAND_RETRY_MINUTES: ${MDM_COMMAND_RETRY_MINUTES:-30}
      MDM_COMMAND_RETRY_MAX_MINUTES: ${MDM_COMMAND_RETRY_MAX_MINUTES:-1440}
      # How long an app install may stay unconfirmed before it is recorded as failed. Only an inventory report naming
      # the bundle id confirms an install, not the device's acknowledgement (reconciler._fail_unconfirmed_apps).
      MDM_APP_CONFIRM_MINUTES: ${MDM_APP_CONFIRM_MINUTES:-60}
      # How often the poller asks a device for its installed apps while an app install on it is unconfirmed. Raising it
      # past MDM_APP_CONFIRM_MINUTES makes installs time out before anything asks. 0 or less turns it off
      # (poller._awaiting_app_confirmation).
      APP_CONFIRM_POLL_MINUTES: ${APP_CONFIRM_POLL_MINUTES:-5}
      # Alert webhooks to private, loopback and link-local targets are refused by default (an SSRF guard that also
      # covers the cloud metadata address). To allow an internal collector, list it here instead of turning the guard
      # off: comma-separated hostnames, IPs or CIDRs, matched after the target's address is resolved.
      DISPATCHER_WEBHOOK_PRIVATE_ALLOWLIST: ${DISPATCHER_WEBHOOK_PRIVATE_ALLOWLIST:-}
      # Deprecated: replaced by the allowlist above. true turns the SSRF guard off for every tenant and target at once.
      DISPATCHER_WEBHOOK_ALLOW_PRIVATE: ${DISPATCHER_WEBHOOK_ALLOW_PRIVATE:-false}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-90}
      FLOW_RUN_RETENTION_DAYS: ${FLOW_RUN_RETENTION_DAYS:-30}
      # Audit log: 0 keeps every row forever (the default). A positive value here only prunes machine-attributed rows,
      # never a human-caused one.
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-0}
      AUDIT_LOG_SIZE_WARNING_ROWS: ${AUDIT_LOG_SIZE_WARNING_ROWS:-100000}
    volumes:
      - yaml_configs:/app/yaml-configs
      - stepca_certs:/stepca-certs:ro
      - stepca_webhook:/stepca-webhook:ro
    ports:
      - "${CONTROLLER_PORT:-8001}:8001" # device-facing: app manifests + enrollment download
    depends_on:
      postgres:
        condition: service_healthy
      yaml-init:
        condition: service_completed_successfully
    # Checks all three supervisord programs: the API and the webhook answer /health (with a DB round trip) and the
    # scheduler touches a heartbeat file. supervisord keeps the container up while a program is in FATAL, so a dead API
    # would otherwise look like a healthy container.
    healthcheck:
      test: [ "CMD", "python", "/app/healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  webui:
    image: ${WEBUI_IMAGE:-ghcr.io/liemeldert/micromanage_2-webui:stable}
    environment:
      CONTROLLER_URL: http://controller:8001
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    depends_on:
      - controller
    restart: unless-stopped

volumes:
  postgres_data:
  nanomdm_data:
  step_ca_data:
  stepca_certs:
  stepca_tls:
  stepca_webhook:
  yaml_configs:
