services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mdm_iac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./controller/scripts/initdb.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Certificate Authority / SCEP ─────────────────────────────────────────
  # step-ca issues device identity certs during MDM enrollment via SCEP. On first
  # boot it initialises an **RSA** CA chain (SCEP needs an RSA intermediate to
  # decrypt the enrollment pkcsPKIEnvelope — step ca init only makes ECDSA) and
  # registers the SCEP provisioner that devices enrol against.
  step-ca:
    image: smallstep/step-ca:latest
    environment:
      STEPCA_NAME: ${STEPCA_NAME:-MicromanageCA}
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:-changeme-ca-password}   # encrypts the CA keys at rest
      MDM_HOSTNAME: ${MDM_HOSTNAME:-mdm.example.com}
      SCEP_NAME: ${SCEP_NAME:-mdm_device_scep}
      SCEP_CHALLENGE: ${SCEP_CHALLENGE:-changeme-scep-challenge}  # must match the controller's SCEP_CHALLENGE
    volumes:
      - step_ca_data:/home/step
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export STEPPATH=/home/step
        PW="$$STEPPATH/password"
        if [ ! -f "$$STEPPATH/config/ca.json" ]; then
          echo "step-ca: first-run init with an RSA chain for SCEP…"
          printf '%s' "$$STEPCA_PASSWORD" > "$$PW"
          step ca init --name "$$STEPCA_NAME" --dns "step-ca,localhost,$$MDM_HOSTNAME" \
            --provisioner admin --password-file "$$PW" --provisioner-password-file "$$PW" \
            --address :9000 --acme
          step certificate create "$$STEPCA_NAME Root CA" "$$STEPPATH/certs/root_ca.crt" "$$STEPPATH/secrets/root_ca_key" \
            --profile root-ca --kty RSA --size 2048 --password-file "$$PW" --force
          step certificate create "$$STEPCA_NAME Intermediate CA" "$$STEPPATH/certs/intermediate_ca.crt" "$$STEPPATH/secrets/intermediate_ca_key" \
            --profile intermediate-ca --ca "$$STEPPATH/certs/root_ca.crt" --ca-key "$$STEPPATH/secrets/root_ca_key" \
            --kty RSA --size 2048 --password-file "$$PW" --ca-password-file "$$PW" --force
          step ca provisioner add "$$SCEP_NAME" --type SCEP --challenge "$$SCEP_CHALLENGE" \
            --encryption-algorithm-identifier 2 --x509-default-dur 8760h --x509-max-dur 8760h \
            --ca-config "$$STEPPATH/config/ca.json"
          echo "step-ca: init complete (RSA chain + SCEP provisioner '$$SCEP_NAME')"
        fi
        exec step-ca "$$STEPPATH/config/ca.json" --password-file "$$PW"
    ports:
      - "9443:9000"
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ── NanoMDM ──────────────────────────────────────────────────────────────
  # Handles the Apple MDM protocol (device check-in, commands, push). NanoMDM has
  # no built-in TLS — it serves plain HTTP on :9000 behind a TLS-terminating proxy.
  # It reads each device's identity cert from the signed `Mdm-Signature` header
  # (the enrollment profile sets SignMessage=true) and validates the chain against
  # step-ca's CA, so no client-cert / mTLS is needed at the proxy.
  # Requires an APNs push cert — upload it to /v1/pushcert (see ./setup.sh apns).
  # One-shot: NanoMDM needs its OWN database (its table names — devices, users… —
  # collide with the controller's) plus its pgsql schema (the backend doesn't
  # self-create tables). Idempotent; the schema ref must match the nanomdm image tag.
  nanomdm-schema:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='nanomdm'" | grep -q 1 \
          || psql -h postgres -U postgres -c "CREATE DATABASE nanomdm"
        if psql -h postgres -U postgres -d nanomdm -tAc "select to_regclass('public.push_certs')" | grep -q push_certs; then
          echo "nanomdm-schema: tables already present"
        else
          echo "nanomdm-schema: applying NanoMDM 0.9.0 pgsql schema to db 'nanomdm'…"
          wget -qO- https://raw.githubusercontent.com/micromdm/nanomdm/v0.9.0/storage/pgsql/schema.sql \
            | psql -h postgres -U postgres -d nanomdm -v ON_ERROR_STOP=1
          echo "nanomdm-schema: done"
        fi
    restart: "no"

  nanomdm:
    image: ghcr.io/micromdm/nanomdm:0.9.0
    environment:
      NANOMDM_API_KEY: ${NANOMDM_API_KEY:?Set NANOMDM_API_KEY in .env}
    volumes:
      - step_ca_data:/stepca:ro   # read step-ca's CA certs to validate device identity certs
      - nanomdm_data:/var/lib/nanomdm
    ports:
      - "8443:9000"   # device-facing MDM endpoint (HTTP — front it with your TLS proxy)
      # Management API: bound to loopback only — never expose to the network.
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      step-ca:
        condition: service_healthy
      nanomdm-schema:
        condition: service_completed_successfully
    command: >
      -storage pgsql
      -storage-dsn "postgres://postgres:${DB_PASSWORD:-changeme}@postgres:5432/nanomdm?sslmode=disable"
      -ca /stepca/certs/root_ca.crt
      -intermediate /stepca/certs/intermediate_ca.crt
      -api "${NANOMDM_API_KEY}"
      -webhook-url "http://controller:8000/webhook/mdm?secret=${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}"
      -debug="${NANOMDM_DEBUG:-false}"
    restart: unless-stopped

  # ── Controller ───────────────────────────────────────────────────────────
  # Python service: syncs YAML compliance state, enqueues MDM commands.
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-changeme}@postgres:5432/mdm_iac
      NANOMDM_URL: http://nanomdm:9000
      NANOMDM_API_KEY: ${NANOMDM_API_KEY:?Set NANOMDM_API_KEY in .env}
      YAML_CONFIG_PATH: /app/yaml-configs
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      # S3 / object store (optional — for hosting app packages)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_USE_SSL: ${AWS_S3_USE_SSL:-true}
      AWS_S3_PATH_STYLE: ${AWS_S3_PATH_STYLE:-false}
      # Public URL used in app manifests sent to devices
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://mdm.example.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-micromanage-controller}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-micromanage-api}
      # Shared secret NanoMDM presents on the webhook callback.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      # Allowed browser origins for the REST API (the web UI proxies server-side).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # ── Device enrollment (auto-generated enrollment profile) ──────────────
      MDM_HOSTNAME: ${MDM_HOSTNAME:-mdm.example.com}
      MDM_TOPIC: ${MDM_TOPIC:-}                # APNs push topic from your MDM push cert
      MDM_SERVER_URL: ${MDM_SERVER_URL:-}      # defaults to https://${MDM_HOSTNAME}/mdm
      SCEP_URL: ${SCEP_URL:-}                  # defaults to https://${MDM_HOSTNAME}/scep/<name>
      SCEP_NAME: ${SCEP_NAME:-mdm_device_scep}
      # Must match step-ca's SCEP_CHALLENGE (same default) so the provisioner accepts enrollments.
      SCEP_CHALLENGE: ${SCEP_CHALLENGE:-changeme-scep-challenge}
      # Optional first-run admin bootstrap (leave unset to provision via the CLI).
      CONTROLLER_BOOTSTRAP_ADMIN_EMAIL: ${CONTROLLER_BOOTSTRAP_ADMIN_EMAIL:-}
      CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./yaml-configs:/app/yaml-configs
    ports:
      - "8001:8001" # REST API consumed by webui
      # Port 8000 (webhook) is internal only — NanoMDM calls it directly
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Web UI ───────────────────────────────────────────────────────────────
  # Next.js 15 management console with YAML compliance editor.
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    environment:
      CONTROLLER_URL: http://controller:8001
      NEXT_PUBLIC_APP_NAME: MicromanageIAC
    ports:
      - "3000:3000"
    depends_on:
      - controller
    restart: unless-stopped

volumes:
  postgres_data:
  nanomdm_data:
  step_ca_data:
