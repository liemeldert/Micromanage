# Dev overlay. Use it with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.dev.yml up
#
# It mounts the live controller source with a shorter sync interval, publishes Postgres on loopback for IDE database
# tools, and disables the webui service (run yarn dev on the host). NanoMDM still validates device certs against
# step-ca. MDM_PORT defaults to 8443 so nanomdm-front binds without root. localhost:8443 serves /mdm and returns 404 for
# everything else, as in production. NanoMDM's own listener, /v1/ included, is on 127.0.0.1:9000.

services:
  # Bound to loopback so the IDE database tools and host scripts can reach the controller database. Production
  # keeps postgres on the compose network with nothing published.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # Compose merges ports additively, so !override replaces the base list; without it 443 would be published as well.
  # An explicit MDM_PORT in the environment or .env still wins over 8443.
  nanomdm-front:
    ports: !override
      - "${MDM_PORT:-8443}:8080"

  controller:
    # Same sum rule as the base file: supervisord stops its programs serially,
    # so this has to exceed 30 + 30 + 30 plus overhead.
    stop_grace_period: 100s
    volumes:
      - ./yaml-configs:/app/yaml-configs
      - ./controller:/app/controller
    environment:
      SYNC_INTERVAL_MINUTES: "1" # reconcile every minute in dev
      PUBLIC_API_URL: "${DEV_TUNNEL_URL:-http://localhost:8001}"
    ports:
      - "8000:8000" # also expose the webhook port in dev, e.g. for ngrok tunnels
      - "8001:8001"

  webui:
    profiles: [ "webui-docker" ] # docker compose ... --profile webui-docker up webui
