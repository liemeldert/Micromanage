# Dev overlay -- use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What changes vs production:
#   - Controller mounts live source, shorter sync interval
#   - WebUI disabled here, run `yarn dev` on the host
# (NanoMDM serves HTTP on 8443 and validates device certs against step-ca)
#

services:
  controller:
    volumes:
      - ./yaml-configs:/app/yaml-configs
      - ./controller:/app/controller
    environment:
      SYNC_INTERVAL_MINUTES: "1" # reconcile every minute in dev
      PUBLIC_API_URL: "${DEV_TUNNEL_URL:-http://localhost:8001}"
    ports:
      - "8000:8000" # also expose the webhook port in dev (
      - "8001:8001"

  webui:
    profiles: ["webui-docker"] # docker compose ... --profile webui-docker up webui
