[supervisord]
nodaemon=true
user=mdm

; All program output goes to the container's stdout/stderr (prefixed by program
; name below) so `docker logs` / Portainer show it. Logging to files inside the
; container instead would leave every failure looking like "nothing in the logs".
;
; Shutdown is SERIAL, not parallel. Each [program:x] with no [group:] is its own
; process group, and supervisord's shutdown stops one group and waits for it to
; reach a stopped state before it pops that group and starts the next
; (supervisord.ordered_stop_groups_phase_1/2). Equal priorities leave the groups
; in config-file order and the last is stopped first, so the real order here is
; userapi, then webhook, then controller. Worst-case shutdown is therefore the
; SUM of the stopwaitsecs below, not the largest of them, and compose's
; stop_grace_period has to exceed that sum or the container is killed with
; whatever is still draining.

[program:controller]
command=python -m controller.main
autostart=true
autorestart=true
; On SIGTERM the controller drains in-flight task handlers (default 20s, see
; MDM_CONTROLLER_SHUTDOWN_DRAIN_SECONDS). The kill timeout must exceed that.
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:webhook]
command=uvicorn controller.api.webhook:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
; The webhook drains deferred fan-out on shutdown (default 10s, see
; MDM_WEBHOOK_SHUTDOWN_DRAIN_SECONDS). The kill timeout must exceed that
; drain window or a mid-burst restart drops queued signals.
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:userapi]
command=uvicorn controller.api.main:app --host 0.0.0.0 --port 8001
autostart=true
autorestart=true
; The API drains the fire-and-forget reconcile/app handlers it spawned before it
; lets the DB pool close (default 15s, see MDM_API_SHUTDOWN_DRAIN_SECONDS). Same
; rule as the two above: this must exceed that drain window, or a restart kills
; handlers mid-command and their task rows sit running until the timeout sweep
; fails them a day later.
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
