[supervisord]
nodaemon=true
user=mdm

; All program output goes to the container's stdout/stderr (prefixed by program
; name below) so `docker logs` / Portainer show it. Previously each program
; logged to files inside the container, which made every failure look like
; "nothing in the logs".

[program:controller]
command=python -m controller.main
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:webhook]
command=uvicorn controller.api.webhook:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:userapi]
command=uvicorn controller.api.main:app --host 0.0.0.0 --port 8001
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
