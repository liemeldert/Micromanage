groups:
  - name: "all-devices"
    description: "All enrolled devices"
    conditions:
      - type: "device_model"
        operator: "regex"
        value: ".*"

  - name: "macbooks"
    description: "All MacBook devices"
    conditions:
      - type: "device_model"
        operator: "regex"
        value: "^MacBook.*"

  - name: "ipads"
    description: "All iPad devices"
    conditions:
      - type: "device_model"
        operator: "regex"
        value: "^iPad.*"
