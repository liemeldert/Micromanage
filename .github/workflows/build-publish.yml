name: Build & publish images

on:
  push:
    branches: [ main, master ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the interpreter the controller image ships (python:3.11-slim in Dockerfile.controller).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: controller/requirements.txt

      - name: Install dependencies
        run: pip install -r controller/requirements.txt

      # Each tests/verify_*.py is a standalone script (no pytest) that runs against in-memory sqlite and exits non-zero
      # on failure. The glob picks up new scripts. All of them run before the job fails, so one run shows every failure.
      - name: Run verify test suite
        run: |
          status=0
          for t in tests/verify_*.py; do
            echo "::group::$t"
            if PYTHONPATH=. python "$t"; then
              echo "PASS: $t"
            else
              echo "FAIL: $t"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # The verify suites run on sqlite and never execute models.database._AUX_DDL, the hand-written Postgres DDL applied on
  # every boot. This job runs it against a fresh Postgres, so a bad statement fails here and not on an upgrade.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mdm_iac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: controller/requirements.txt
      - name: Install dependencies
        run: pip install -r controller/requirements.txt
      - name: Apply the schema to a fresh Postgres and check it
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/mdm_iac
        run: PYTHONPATH=. python tests/pg_schema_check.py

  build:
    needs: [ test, schema ]
    # Skipped for pull requests, since a PR from a fork gets a read-only GITHUB_TOKEN that cannot log in to ghcr.io.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            context: .
            file: Dockerfile.controller
          - name: webui
            context: webui
            file: webui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
